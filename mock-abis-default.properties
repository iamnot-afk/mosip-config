# Follow properites have their values assigned via 'overrides' environment variables of config server docker.
# DO NOT define these in any of the property files.  They must be passed as env variables.  Refer to config-server
# helm chart:
#   mosip.mosip.regproc.client.secret
spring.cloud.config.name=mock-abis
spring.application.name=mock-abis-service
management.endpoint.health.show-details=always
management.endpoits.web.exposure.include=info,health,refresh
server.port=8081
abis.return.duplicate=false
secret_url=${mosip.kernel-auth-service.url}/v1/authmanager/authenticate/clientidsecretkey
secret_url.clientnId=mosip-regproc-client
secret_url.id=string
secret_url.secretKey=${mosip.mosip.regproc.client.secret}
secret_url.appId=regproc

# Partner certificate configuration for ABIS decryption
certificate.filename=/home/mosip/certs/partner.p12
certificate.password=mosip123
certificate.alias=partner
certificate.keystore=PKCS12
abis.bio.encryption=false

# Override IAM adapter token endpoint for internal use
mosip.iam.adapter.appid=abis
mosip.iam.adapter.clientid=mosip-abis-client
mosip.iam.adapter.clientsecret=${mosip.abis.client.secret}
mosip.iam.adapter.self-token-renewal-enable=true
mosip.iam.adapter.validate-expiry-check-rate=15
mosip.iam.adapter.renewal-before-expiry-interval=15
mosip.iam.adapter.token.endpoint=http://keycloak.keycloak/auth/realms/mosip/protocol/openid-connect/token
mosip.iam.adapter.self.token.endpoint=http://keycloak.keycloak/auth/realms/mosip/protocol/openid-connect/token
mosip.iam.adapter.issuerURL=http://keycloak.keycloak/auth/realms/mosip
mosip.iam.adapter.issuer.url=http://keycloak.keycloak/auth/realms/
mosip.iam.adapter.certs.endpoint=http://keycloak.keycloak/auth/realms/mosip/protocol/openid-connect/certs
